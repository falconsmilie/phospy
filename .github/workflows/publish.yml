name: Publish

on:
  push:
    tags:
      - 'tv*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained release dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt -e ".[dev,test,parquet]"
          python -m pip install -c constraints/ci.txt build twine setuptools wheel
      - name: Run release checks and build distributions
        run: make release-check
      - name: Store distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  installed-distribution-verification:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Verify installed wheel and sdist outside checkout
        run: |
          python scripts/verify_installed_distributions.py --dist-dir dist --repo-root "$GITHUB_WORKSPACE" --constraint constraints/ci.txt

  publish-to-testpypi:
    if: startsWith(github.ref, 'refs/tags/tv')
    needs:
      - build
      - installed-distribution-verification
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/phospy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/
          packages-dir: dist/

  publish-to-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - build
      - installed-distribution-verification
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phospy
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
