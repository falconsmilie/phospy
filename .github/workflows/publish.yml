name: Publish

on:
  push:
    tags:
      - 'tv*'
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  release-gate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install release-gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,parquet]"
      - name: Run documented scientific release gate
        run: make test-release-gate
      - name: Store release-gate reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-gate-py${{ matrix.python-version }}
          path: |
            build/release-gate/
            build/reports/

  build:
    needs:
      - release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Build and validate distributions
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          make build
          twine check dist/*
      - name: Store distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  distribution-install-tests:
    needs:
      - build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Install wheel artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python -m venv .venv-wheel
          source .venv-wheel/bin/activate
          python -m pip install --upgrade pip
          wheel=(dist/*.whl)
          python -m pip install -c constraints/ci.txt "${wheel[0]}[test]"
          python -m pip check
          python -c "import importlib.metadata as md; import phospy; print(md.version('phospy'))"
          python -m pip freeze > "build/reports/wheel-install-py${{ matrix.python-version }}.txt"
      - name: Install sdist artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python -m venv .venv-sdist
          source .venv-sdist/bin/activate
          python -m pip install --upgrade pip
          sdist=(dist/*.tar.gz)
          python -m pip install -c constraints/ci.txt "${sdist[0]}[test]"
          python -m pip check
          python -c "import importlib.metadata as md; import phospy; print(md.version('phospy'))"
          python -m pip freeze > "build/reports/sdist-install-py${{ matrix.python-version }}.txt"
      - name: Store distribution install reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: distribution-install-py${{ matrix.python-version }}
          path: build/reports/

  publish-to-testpypi:
    if: startsWith(github.ref, 'refs/tags/tv')
    needs:
      - distribution-install-tests
    runs-on: ubuntu-latest
    environment:
      name: testpypi
      url: https://test.pypi.org/p/phospy
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to TestPyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-to-pypi:
    if: startsWith(github.ref, 'refs/tags/v')
    needs:
      - distribution-install-tests
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/phospy
    permissions:
      id-token: write
    steps:
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish distributions to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
