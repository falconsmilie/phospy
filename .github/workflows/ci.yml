name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fail on tracked ignored/generated artefacts
        shell: bash
        run: |
          set -euo pipefail

          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          tracked_generated="$(
            git ls-files \
            | grep -E '(^|/)__pycache__/|(^|/)[^/]+\.egg-info/|^benchmarks/reports/' || true
          )"

          if [[ -n "${tracked_ignored}" || -n "${tracked_generated}" ]]; then
            echo "Tracked ignored/generated artefacts detected."
            echo "Remove these files from git tracking before merging."
            if [[ -n "${tracked_ignored}" ]]; then
              echo
              echo "Tracked files that match .gitignore:"
              printf '%s\n' "${tracked_ignored}"
            fi
            if [[ -n "${tracked_generated}" ]]; then
              echo
              echo "Tracked generated artefacts blocked by CI policy:"
              printf '%s\n' "${tracked_generated}"
            fi
            exit 1
          fi

  lint:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run Ruff hooks
        run: |
          pre-commit run ruff-check --all-files
          pre-commit run ruff-format --all-files

  type-check:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained development dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
      - name: Show type-check environment
        run: |
          source .venv/bin/activate
          python -c "import sys, importlib.metadata as md; print('python', sys.version); print('executable', sys.executable); print('pyright', md.version('pyright')); print('pandas', md.version('pandas')); print('pandas-stubs', md.version('pandas-stubs')); print('numpy', md.version('numpy')); print('scipy', md.version('scipy')); print('scikit-learn', md.version('scikit-learn'))"
      - name: Run Pyright
        run: |
          source .venv/bin/activate
          export PHOSPY_PYRIGHT_PYTHON="$PWD/.venv/bin/python"
          python scripts/run_pyright.py --verbose

  clean-constrained-install:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained dev and test extras in a clean venv
        run: |
          python -m venv .venv-clean
          source .venv-clean/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
          python -m pip check
          mkdir -p build/reports
          python -m pip freeze > "build/reports/clean-install-py${{ matrix.python-version }}.txt"
      - name: Retain clean install report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: clean-install-py${{ matrix.python-version }}
          path: build/reports/clean-install-py${{ matrix.python-version }}.txt

  benchmark-smoke:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run benchmark script smoke checks
        run: pytest tests/unit/test_benchmark_scripts_smoke.py

  testing-audit-freshness:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Regenerate testing audit docs
        run: |
          python tools/testing/generate_test_inventory.py
          python tools/testing/find_validator_test_patterns.py
          python tools/testing/find_dataframe_ownership_tests.py
          python tools/testing/find_diagnostic_assertion_clusters.py
          python tools/testing/find_orchestration_test_candidates.py
          python tools/testing/generate_test_inventory.py
          python tools/testing/find_validator_test_patterns.py
          python tools/testing/find_dataframe_ownership_tests.py
          python tools/testing/find_diagnostic_assertion_clusters.py
          python tools/testing/find_orchestration_test_candidates.py
      - name: Fail if generated testing audit docs are stale
        run: |
          git diff --exit-code -- \
            docs/testing/test_inventory.csv \
            docs/testing/test_inventory.md \
            docs/testing/validator_test_pattern_report.md \
            docs/testing/dataframe_ownership_test_report.md \
            docs/testing/diagnostic_payload_test_report.md \
            docs/testing/orchestration_test_candidates.md

  default-suite:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run full default pytest suite
        run: |
          mkdir -p build/reports
          pytest --durations=25 --durations-min=0.01 -m "not parity" --junitxml "build/reports/default-suite-py${{ matrix.python-version }}.xml"
      - name: Retain default-suite duration report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: default-suite-py${{ matrix.python-version }}
          path: build/reports/default-suite-py${{ matrix.python-version }}.xml

  performance-contracts:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run performance contract tests
        run: make test-performance
      - name: Retain performance budget reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: performance-contracts
          path: build/reports/

  adaptive-mode-standard-install:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package from standard dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Verify adaptive dependency contract
        run: |
          python -c "import importlib.metadata as md; requirements = md.requires('phospy') or []; assert any(req.lower().startswith('scikit-learn') for req in requirements), requirements"
          python -c "from phospy.science.prediction.svm import require_sklearn; require_sklearn()"
      - name: Run adaptive-mode tests
        run: pytest tests/unit/test_prediction_adaptive_sampling.py tests/unit/test_prediction_mode_regression.py tests/unit/test_prediction_svm_dependency_guard.py

  activity-parity-gate:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run activity parity hard gate
        run: pytest tests/parity/test_activity_stage_parity.py -m "parity and activity_parity" -s

  parity-tests:
    needs: [repo-hygiene, activity-parity-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run rewrite parity scientific gates
        run: pytest tests/parity -m "parity and not parity_diagnostic" -s

  release-gate:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install release-gate dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev,test,parquet]"
      - name: Run documented scientific release gate
        run: make test-release-gate
      - name: Retain release-gate audit and duration reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-gate-py${{ matrix.python-version }}
          path: |
            build/release-gate/
            build/reports/

  parity-diagnostics:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run informational parity diagnostics
        run: pytest tests/parity -m "parity_diagnostic" -s

  build-distributions:
    needs:
      - release-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Build distributions and validate metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt build twine setuptools wheel
          make build
          twine check dist/*
      - name: Store distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
      - name: Store build manifest
        uses: actions/upload-artifact@v5
        with:
          name: python-package-build-manifest
          path: build/reports/build-manifest.json

  distribution-install-tests:
    needs: build-distributions
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Download build manifest
        uses: actions/download-artifact@v6
        with:
          name: python-package-build-manifest
          path: build/reports/
      - name: Install wheel artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python -m venv .venv-wheel
          source .venv-wheel/bin/activate
          python -m pip install --upgrade pip
          wheel=("$GITHUB_WORKSPACE"/dist/*.whl)
          python -m pip install -c "$GITHUB_WORKSPACE/constraints/ci.txt" "${wheel[0]}"
          python -m pip check
          verify_dir="$(mktemp -d)"
          cd "$verify_dir"
          python -I "$GITHUB_WORKSPACE/scripts/verify_distribution_artifact.py" \
            --artifact-kind wheel \
            --artifact-path "${wheel[0]}" \
            --build-manifest "$GITHUB_WORKSPACE/build/reports/build-manifest.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --report-json "$GITHUB_WORKSPACE/build/reports/wheel-artifact-py${{ matrix.python-version }}.json"
          python -m pip freeze > "$GITHUB_WORKSPACE/build/reports/wheel-install-py${{ matrix.python-version }}.txt"
      - name: Install sdist artifact
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          python -m venv .venv-sdist
          source .venv-sdist/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -c "$GITHUB_WORKSPACE/constraints/ci.txt" setuptools wheel
          sdist=("$GITHUB_WORKSPACE"/dist/*.tar.gz)
          python -m pip install --no-build-isolation -c "$GITHUB_WORKSPACE/constraints/ci.txt" "${sdist[0]}"
          python -m pip check
          verify_dir="$(mktemp -d)"
          cd "$verify_dir"
          python -I "$GITHUB_WORKSPACE/scripts/verify_distribution_artifact.py" \
            --artifact-kind sdist \
            --artifact-path "${sdist[0]}" \
            --build-manifest "$GITHUB_WORKSPACE/build/reports/build-manifest.json" \
            --repository-root "$GITHUB_WORKSPACE" \
            --report-json "$GITHUB_WORKSPACE/build/reports/sdist-artifact-py${{ matrix.python-version }}.json"
          python -m pip freeze > "$GITHUB_WORKSPACE/build/reports/sdist-install-py${{ matrix.python-version }}.txt"
      - name: Retain distribution install reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: distribution-install-py${{ matrix.python-version }}
          path: build/reports/

  release-verdict:
    needs:
      - repo-hygiene
      - lint
      - type-check
      - clean-constrained-install
      - default-suite
      - performance-contracts
      - release-gate
      - build-distributions
      - distribution-install-tests
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Publish reproducible release verdict
        shell: bash
        run: |
          set -euo pipefail
          declare -A results=(
            [repo-hygiene]="${{ needs.repo-hygiene.result }}"
            [lint]="${{ needs.lint.result }}"
            [type-check]="${{ needs.type-check.result }}"
            [clean-constrained-install]="${{ needs.clean-constrained-install.result }}"
            [default-suite]="${{ needs.default-suite.result }}"
            [performance-contracts]="${{ needs.performance-contracts.result }}"
            [release-gate]="${{ needs.release-gate.result }}"
            [build-distributions]="${{ needs.build-distributions.result }}"
            [distribution-install-tests]="${{ needs.distribution-install-tests.result }}"
          )

          {
            echo "## Release Verification Verdict"
            echo
            echo "| Check | Result |"
            echo "| --- | --- |"
            for job in repo-hygiene lint type-check clean-constrained-install default-suite performance-contracts release-gate build-distributions distribution-install-tests; do
              echo "| ${job} | ${results[$job]} |"
            done
            echo
            echo "The release verdict is valid only when every row is success."
          } >> "$GITHUB_STEP_SUMMARY"

          for job in "${!results[@]}"; do
            if [[ "${results[$job]}" != "success" ]]; then
              echo "Release verification failed at ${job}: ${results[$job]}" >&2
              exit 1
            fi
          done
