name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fail on tracked ignored/generated artefacts
        shell: bash
        run: |
          set -euo pipefail

          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          tracked_generated="$(
            git ls-files \
            | grep -E '(^|/)__pycache__/|(^|/)[^/]+\.egg-info/|^benchmarks/reports/' || true
          )"

          if [[ -n "${tracked_ignored}" || -n "${tracked_generated}" ]]; then
            echo "Tracked ignored/generated artefacts detected."
            echo "Remove these files from git tracking before merging."
            if [[ -n "${tracked_ignored}" ]]; then
              echo
              echo "Tracked files that match .gitignore:"
              printf '%s\n' "${tracked_ignored}"
            fi
            if [[ -n "${tracked_generated}" ]]; then
              echo
              echo "Tracked generated artefacts blocked by CI policy:"
              printf '%s\n' "${tracked_generated}"
            fi
            exit 1
          fi

  lint:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run Ruff hooks
        run: |
          pre-commit run ruff-check --all-files
          pre-commit run ruff-format --all-files

  type-check:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained development dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
      - name: Show type-check environment
        run: |
          source .venv/bin/activate
          python -c "import sys, importlib.metadata as md; print('python', sys.version); print('executable', sys.executable); print('pyright', md.version('pyright')); print('pandas', md.version('pandas')); print('pandas-stubs', md.version('pandas-stubs')); print('numpy', md.version('numpy')); print('scipy', md.version('scipy')); print('scikit-learn', md.version('scikit-learn'))"
      - name: Run Pyright
        run: |
          source .venv/bin/activate
          export PHOSPY_PYRIGHT_PYTHON="$PWD/.venv/bin/python"
          python scripts/run_pyright.py --verbose

  clean-constrained-install:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained dev and test extras in a clean venv
        run: |
          python -m venv .venv-clean
          source .venv-clean/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
          python -m pip check
          mkdir -p build/reports
          python -m pip freeze > "build/reports/clean-install-py${{ matrix.python-version }}.txt"
      - name: Retain clean install report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: clean-install-py${{ matrix.python-version }}
          path: build/reports/clean-install-py${{ matrix.python-version }}.txt

  benchmark-smoke:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run benchmark script smoke checks
        run: pytest tests/unit/test_benchmark_scripts_smoke.py

  testing-audit-freshness:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Regenerate testing audit docs
        run: |
          python tools/testing/generate_test_inventory.py
          python tools/testing/find_validator_test_patterns.py
          python tools/testing/find_dataframe_ownership_tests.py
          python tools/testing/find_diagnostic_assertion_clusters.py
          python tools/testing/find_orchestration_test_candidates.py
          python tools/testing/generate_test_inventory.py
          python tools/testing/find_validator_test_patterns.py
          python tools/testing/find_dataframe_ownership_tests.py
          python tools/testing/find_diagnostic_assertion_clusters.py
          python tools/testing/find_orchestration_test_candidates.py
      - name: Fail if generated testing audit docs are stale
        run: |
          git diff --exit-code -- \
            docs/testing/test_inventory.csv \
            docs/testing/test_inventory.md \
            docs/testing/validator_test_pattern_report.md \
            docs/testing/dataframe_ownership_test_report.md \
            docs/testing/diagnostic_payload_test_report.md \
            docs/testing/orchestration_test_candidates.md

  default-suite:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run full default pytest suite
        run: |
          mkdir -p build/reports
          pytest --durations=25 --durations-min=0.01 -m "not parity" --junitxml "build/reports/default-suite-py${{ matrix.python-version }}.xml"
      - name: Retain default-suite duration report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: default-suite-py${{ matrix.python-version }}
          path: build/reports/default-suite-py${{ matrix.python-version }}.xml

  performance-contracts:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run performance contract tests
        run: make test-performance
      - name: Retain performance budget reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: performance-contracts
          path: build/reports/

  reference-bundles:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Validate checked-in reference bundle manifests and files
        run: make validate-reference-bundles

  release-gates:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run release and golden release gates
        run: make test-release-gates
      - name: Retain release-gates report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-gates
          path: build/reports/release-gates.xml

  adaptive-mode-standard-install:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package from standard dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Verify adaptive dependency contract
        run: |
          python -c "import importlib.metadata as md; requirements = md.requires('phospy') or []; assert any(req.lower().startswith('scikit-learn') for req in requirements), requirements"
          python -c "from phospy.science.prediction.svm import require_sklearn; require_sklearn()"
      - name: Run adaptive-mode tests
        run: pytest tests/unit/test_prediction_adaptive_sampling.py tests/unit/test_prediction_mode_regression.py tests/unit/test_prediction_svm_dependency_guard.py

  activity-parity-gate:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run activity parity hard gate
        run: pytest tests/parity/test_activity_stage_parity.py -m "parity and activity_parity" -s

  parity-tests:
    needs: [repo-hygiene, activity-parity-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run rewrite parity scientific gates
        run: pytest tests/parity -m "parity and not parity_diagnostic" -s

  parity-diagnostics:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run informational parity diagnostics
        run: pytest tests/parity -m "parity_diagnostic" -s

  build-distributions:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Build distributions and validate metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt build twine setuptools wheel
          make build
      - name: Smoke-test installed wheel outside checkout
        shell: bash
        run: |
          set -euo pipefail
          shopt -s nullglob
          wheels=(dist/*.whl)
          sdists=(dist/*.tar.gz)
          if (( ${#wheels[@]} != 1 )); then
            echo "Expected exactly one wheel in dist/, found ${#wheels[@]}" >&2
            exit 1
          fi
          if (( ${#sdists[@]} != 1 )); then
            echo "Expected exactly one sdist in dist/, found ${#sdists[@]}" >&2
            exit 1
          fi
          smoke_dir="$(mktemp -d)"
          python -m venv "$smoke_dir/venv"
          "$smoke_dir/venv/bin/python" -m pip install --upgrade pip
          "$smoke_dir/venv/bin/python" -m pip install -c "$GITHUB_WORKSPACE/constraints/ci.txt" "${wheels[0]}"
          "$smoke_dir/venv/bin/python" -m pip check
          cd "$smoke_dir"
          "$smoke_dir/venv/bin/python" -I -c "import pathlib, phospy; print(pathlib.Path(phospy.__file__).resolve())"
      - name: Store distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/
