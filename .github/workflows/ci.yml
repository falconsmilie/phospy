name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fail on tracked ignored/generated artefacts
        shell: bash
        run: |
          set -euo pipefail

          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          tracked_generated="$(
            git ls-files \
            | grep -E '(^|/)__pycache__/|(^|/)[^/]+\.egg-info/|^benchmarks/reports/' || true
          )"

          if [[ -n "${tracked_ignored}" || -n "${tracked_generated}" ]]; then
            echo "Tracked ignored/generated artefacts detected."
            echo "Remove these files from git tracking before merging."
            if [[ -n "${tracked_ignored}" ]]; then
              echo
              echo "Tracked files that match .gitignore:"
              printf '%s\n' "${tracked_ignored}"
            fi
            if [[ -n "${tracked_generated}" ]]; then
              echo
              echo "Tracked generated artefacts blocked by CI policy:"
              printf '%s\n' "${tracked_generated}"
            fi
            exit 1
          fi

  lint:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run Ruff hooks
        run: pre-commit run --all-files

  unit-tests:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run unit tests
        run: pytest tests/unit

  integration-tests:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run integration tests
        run: pytest tests/integration

  activity-parity-gate:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run activity parity hard gate
        run: PHOSPY_SHOW_PARITY=1 PHOSPY_SHOW_REPLAYED_PREDICTION_MODE_COMPARISON=1 pytest tests/parity/test_activity_stage_parity.py -m "parity and activity_parity" -s

  parity-tests:
    needs: [repo-hygiene, activity-parity-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run parity tests
        run: PHOSPY_SHOW_PARITY=1 PHOSPY_SHOW_REPLAYED_PREDICTION_MODE_COMPARISON=1 pytest tests/parity -m parity -s

  build-distributions:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
      - name: Build distributions and validate metadata
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
