name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fail on tracked ignored/generated artefacts
        shell: bash
        run: |
          set -euo pipefail

          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          tracked_generated="$(
            git ls-files \
            | grep -E '(^|/)__pycache__/|(^|/)[^/]+\.egg-info/|^benchmarks/reports/' || true
          )"

          if [[ -n "${tracked_ignored}" || -n "${tracked_generated}" ]]; then
            echo "Tracked ignored/generated artefacts detected."
            echo "Remove these files from git tracking before merging."
            if [[ -n "${tracked_ignored}" ]]; then
              echo
              echo "Tracked files that match .gitignore:"
              printf '%s\n' "${tracked_ignored}"
            fi
            if [[ -n "${tracked_generated}" ]]; then
              echo
              echo "Tracked generated artefacts blocked by CI policy:"
              printf '%s\n' "${tracked_generated}"
            fi
            exit 1
          fi

  lint:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run Ruff hooks
        run: |
          pre-commit run ruff-check --all-files
          pre-commit run ruff-format --all-files

  type-check:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
      - name: Install package with development dependencies
        run: |
          unset PIP_CONSTRAINT PIP_BUILD_CONSTRAINT
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Show type-check environment
        run: |
          unset PIP_CONSTRAINT PIP_BUILD_CONSTRAINT
          source .venv/bin/activate
          python -c "import sys, importlib.metadata as md; print('python', sys.version); print('executable', sys.executable); print('pyright', md.version('pyright')); print('pandas', md.version('pandas')); print('pandas-stubs', md.version('pandas-stubs')); print('numpy', md.version('numpy')); print('scipy', md.version('scipy')); print('scikit-learn', md.version('scikit-learn'))"
      - name: Run Pyright
        run: |
          unset PIP_CONSTRAINT PIP_BUILD_CONSTRAINT
          source .venv/bin/activate
          export PHOSPY_PYRIGHT_PYTHON="$PWD/.venv/bin/python"
          python scripts/run_pyright.py --verbose

  benchmark-smoke:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run benchmark script smoke checks
        run: pytest tests/unit/test_benchmark_scripts_smoke.py

  testing-audit-freshness:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
      - name: Regenerate testing audit docs
        run: |
          python tools/testing/generate_test_inventory.py
          python tools/testing/find_validator_test_patterns.py
          python tools/testing/find_dataframe_ownership_tests.py
          python tools/testing/find_diagnostic_assertion_clusters.py
          python tools/testing/find_orchestration_test_candidates.py
          python tools/testing/generate_test_inventory.py
          python tools/testing/find_validator_test_patterns.py
          python tools/testing/find_dataframe_ownership_tests.py
          python tools/testing/find_diagnostic_assertion_clusters.py
          python tools/testing/find_orchestration_test_candidates.py
      - name: Fail if generated testing audit docs are stale
        run: |
          git diff --exit-code -- \
            docs/testing/test_inventory.csv \
            docs/testing/test_inventory.md \
            docs/testing/validator_test_pattern_report.md \
            docs/testing/dataframe_ownership_test_report.md \
            docs/testing/diagnostic_payload_test_report.md \
            docs/testing/orchestration_test_candidates.md

  performance-contracts:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run performance contract tests
        run: pytest tests/performance -m performance -q

  unit-tests:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run unit tests
        run: pytest tests/unit

  adaptive-mode-standard-install:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package from standard dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Verify adaptive dependency contract
        run: |
          python -c "import importlib.metadata as md; requirements = md.requires('phospy') or []; assert any(req.lower().startswith('scikit-learn') for req in requirements), requirements"
          python -c "from phospy.science.prediction.svm import require_sklearn; require_sklearn()"
      - name: Run adaptive-mode tests
        run: pytest tests/unit/test_prediction_adaptive_sampling.py tests/unit/test_prediction_mode_regression.py tests/unit/test_prediction_svm_dependency_guard.py

  integration-tests:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run integration tests
        run: pytest tests/integration

  activity-parity-gate:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run activity parity hard gate
        run: pytest tests/parity/test_activity_stage_parity.py -m "parity and activity_parity" -s

  parity-tests:
    needs: [repo-hygiene, activity-parity-gate]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run rewrite parity scientific gates
        run: pytest tests/parity -m parity -s

  build-distributions:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Build distributions and validate metadata
        run: |
          python -m pip install --upgrade pip
          pip install build twine
          python -m build
          twine check dist/*
