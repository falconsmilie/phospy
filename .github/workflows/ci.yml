name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  PIP_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt
  PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/ci.txt

jobs:
  repo-hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Enforce repository hygiene policy
        run: python scripts/check_repository_hygiene.py --repo-root .
      - name: Fail on tracked ignored/generated artefacts
        shell: bash
        run: |
          set -euo pipefail

          tracked_ignored="$(git ls-files -ci --exclude-standard)"
          tracked_generated="$(
            git ls-files \
            | grep -E '(^|/)__pycache__/|(^|/)[^/]+\.egg-info/|^benchmarks/reports/' || true
          )"

          if [[ -n "${tracked_ignored}" || -n "${tracked_generated}" ]]; then
            echo "Tracked ignored/generated artefacts detected."
            echo "Remove these files from git tracking before merging."
            if [[ -n "${tracked_ignored}" ]]; then
              echo
              echo "Tracked files that match .gitignore:"
              printf '%s\n' "${tracked_ignored}"
            fi
            if [[ -n "${tracked_generated}" ]]; then
              echo
              echo "Tracked generated artefacts blocked by CI policy:"
              printf '%s\n' "${tracked_generated}"
            fi
            exit 1
          fi

  lint:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install pre-commit
        run: |
          python -m pip install --upgrade pip
          pip install pre-commit
      - name: Run Ruff hooks
        run: |
          pre-commit run ruff-check --all-files
          pre-commit run ruff-format --all-files

  type-check:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained development dependencies
        run: |
          python -m venv .venv
          source .venv/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
      - name: Show type-check environment
        run: |
          source .venv/bin/activate
          python -c "import sys, importlib.metadata as md; print('python', sys.version); print('executable', sys.executable); print('pyright', md.version('pyright')); print('pandas', md.version('pandas')); print('pandas-stubs', md.version('pandas-stubs')); print('numpy', md.version('numpy')); print('scipy', md.version('scipy')); print('scikit-learn', md.version('scikit-learn'))"
      - name: Run Pyright
        run: |
          source .venv/bin/activate
          export PHOSPY_PYRIGHT_PYTHON="$PWD/.venv/bin/python"
          python tools/testing/pyright_strict_coverage.py --check
          python scripts/run_pyright.py --verbose

  clean-constrained-install:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install constrained dev and test extras in a clean venv
        run: |
          python -m venv .venv-clean
          source .venv-clean/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,test]"
          python -m pip check
          mkdir -p build/reports
          python -m pip freeze > "build/reports/clean-install-py${{ matrix.python-version }}.txt"
      - name: Retain clean install report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: clean-install-py${{ matrix.python-version }}
          path: build/reports/clean-install-py${{ matrix.python-version }}.txt

  minimum-dependency-suite:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    env:
      PIP_CONSTRAINT: ${{ github.workspace }}/constraints/minimum.txt
      PIP_BUILD_CONSTRAINT: ${{ github.workspace }}/constraints/minimum.txt
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/minimum.txt
      - name: Install minimum supported runtime and test dependencies
        run: |
          python -m venv .venv-minimum
          source .venv-minimum/bin/activate
          python -m pip install --upgrade pip
          python -m pip install -c constraints/minimum.txt -e ".[test]"
          python -m pip check
          mkdir -p build/reports
          python -m pip freeze > build/reports/minimum-dependencies-py3.11.txt
      - name: Run minimum-dependency non-parity suite
        run: |
          source .venv-minimum/bin/activate
          pytest --durations=25 --durations-min=0.01 -m "not parity" --junitxml build/reports/minimum-non-parity-py3.11.xml
      - name: Run minimum-dependency release and golden gates
        run: |
          source .venv-minimum/bin/activate
          pytest -o addopts= tests/release tests/golden -m "release_gate or golden or reproducibility" --junitxml build/reports/minimum-release-gates-py3.11.xml
      - name: Retain minimum-dependency reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: minimum-dependency-suite-py3.11
          path: build/reports/

  exact-provenance-bytes:
    needs: repo-hygiene
    runs-on: windows-latest
    env:
      OPENBLAS_CORETYPE: Haswell
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: conda-incubator/setup-miniconda@v4
        with:
          activate-environment: exact-provenance
          python-version: '3.11.15'
      - name: Install exact provenance regression environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt -e ".[test]"
      - name: Verify exact provenance regression environment
        run: |
          $pythonRecord = @(conda list --json python | ConvertFrom-Json | Where-Object { $_.name -eq 'python' })
          if ($pythonRecord.Count -ne 1 -or $pythonRecord[0].build_string -ne 'hb00fc5c_1') {
            throw "Expected Anaconda Python build hb00fc5c_1; actual=$($pythonRecord | ConvertTo-Json -Compress)"
          }
          python -c "import importlib.metadata as md, numpy as np, platform, sys; expected={'python':'3.11.15','numpy':'2.2.6','pandas':'2.2.3','scipy':'1.15.2','scikit-learn':'1.6.1'}; actual={'python':platform.python_version(),**{name:md.version(name) for name in ('numpy','pandas','scipy','scikit-learn')}}; assert platform.system() == 'Windows', platform.platform(); assert platform.machine() == 'AMD64', platform.machine(); assert 'packaged by Anaconda, Inc.' in sys.version, sys.version; assert actual == expected, (expected, actual); np.show_runtime()"
      - name: Run exact provenance-byte regression
        run: |
          New-Item -ItemType Directory -Path build/reports -Force | Out-Null
          python -m pytest -o addopts= tests/release/test_batch_correction_regression.py::test_batch_correction_provenance_bytes_match_pinned_regression --junitxml build/reports/exact-provenance-bytes-windows-py3.11.15.xml
      - name: Retain exact provenance-byte JUnit evidence
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: exact-provenance-bytes-windows-py3.11.15
          path: build/reports/exact-provenance-bytes-windows-py3.11.15.xml

  benchmark-smoke:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run benchmark script smoke checks
        run: pytest tests/unit/test_benchmark_scripts_smoke.py

  testing-audit-freshness:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
      - name: Regenerate testing audit docs
        run: |
          python tools/testing/generate_test_inventory.py
          python tools/testing/find_validator_test_patterns.py
          python tools/testing/find_dataframe_ownership_tests.py
          python tools/testing/find_diagnostic_assertion_clusters.py
          python tools/testing/find_orchestration_test_candidates.py
      - name: Fail if generated testing audit docs are stale
        run: |
          git diff --exit-code -- \
            docs/testing/test_inventory.csv \
            docs/testing/test_inventory.md \
            docs/testing/validator_test_pattern_report.md \
            docs/testing/dataframe_ownership_test_report.md \
            docs/testing/diagnostic_payload_test_report.md \
            docs/testing/orchestration_test_candidates.md

  default-suite:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run full default pytest suite
        run: |
          mkdir -p build/reports
          pytest --durations=25 --durations-min=0.01 -m "not parity" --junitxml "build/reports/default-suite-py${{ matrix.python-version }}.xml"
      - name: Retain default-suite duration report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: default-suite-py${{ matrix.python-version }}
          path: build/reports/default-suite-py${{ matrix.python-version }}.xml

  public-consumer-contracts:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run public-consumer contract tests
        run: make test-contract
      - name: Retain public-consumer contract report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: public-consumer-contracts-py${{ matrix.python-version }}
          path: build/reports/contract.xml

  performance-contracts:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run performance contract tests
        run: make test-performance
      - name: Retain performance budget reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: performance-contracts-py${{ matrix.python-version }}
          path: build/reports/

  reference-bundles:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Validate checked-in reference bundle manifests and files
        run: make validate-reference-bundles

  fixture-integrity:
    needs: repo-hygiene
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run manifest-governed fixture integrity checks
        run: python -m pytest -o addopts= tests/release/test_manifest_fixture_byte_reproducibility.py::test_manifest_governed_fixtures_use_canonical_lf_bytes_and_valid_hashes tests/release/test_manifest_fixture_byte_reproducibility.py::test_duplicate_correlation_limma_fixture_manifest_hashes_match_checked_in_files tests/release/test_evidence_resolution_regression_fixtures.py::test_evidence_resolution_fixture_manifest_hashes_match_files tests/release/test_kinase_sparse_support_regression_fixtures.py::test_kinase_sparse_support_fixture_manifest_hashes_match_files tests/release/test_signalome_safety_regression_fixtures.py::test_signalome_safety_fixture_manifest_hashes_match_files tests/parity/test_differential_limma_trend_large.py::test_large_limma_trend_fixture_manifest_hashes_match_checked_in_files

  release-gates:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run release and golden release gates
        run: make test-release-gates
      - name: Retain release-gates report
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: release-gates-py${{ matrix.python-version }}
          path: build/reports/release-gates.xml

  adaptive-mode-standard-install:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package from standard dependency set
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest
      - name: Verify adaptive dependency contract
        run: |
          python -c "import importlib.metadata as md; requirements = md.requires('phospy') or []; assert any(req.lower().startswith('scikit-learn') for req in requirements), requirements"
          python -c "from phospy.kinase.prediction.svm import require_sklearn; require_sklearn()"
      - name: Run adaptive-mode tests
        run: pytest tests/unit/test_prediction_adaptive_sampling.py tests/unit/test_prediction_mode_regression.py tests/unit/test_prediction_svm_dependency_guard.py

  activity-parity-gate:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run activity parity hard gate
        run: pytest tests/parity/test_activity_stage_parity.py -m "parity and activity_parity" -s

  parity-tests:
    needs: [repo-hygiene, activity-parity-gate]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run rewrite parity scientific gates
        run: pytest tests/parity -m "parity and not parity_diagnostic" -s

  parity-diagnostics:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install package
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[test]"
      - name: Run informational parity diagnostics
        run: pytest tests/parity -m "parity_diagnostic" -s

  architecture-release-source-runtime:
    needs: repo-hygiene
    runs-on: ${{ matrix.os }}
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
          fetch-depth: 2
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Install GNU Make on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install make --no-progress -y
      - name: Install complete gate environment
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt -e ".[dev,test,docs]"
      - name: Record candidate and runtime identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          {
            git rev-parse HEAD
            git rev-parse HEAD^{tree}
            git rev-parse HEAD^
            git log -1 --format=%s
            python -c "import json, platform, sys; print(json.dumps({'os': platform.system(), 'release': platform.release(), 'architecture': platform.machine(), 'platform': platform.platform(), 'python': sys.version, 'executable': sys.executable}, sort_keys=True))"
            python -c "import tomllib; print('pyright_python_version=' + tomllib.load(open('pyproject.toml','rb'))['tool']['pyright']['pythonVersion'])"
            git hash-object constraints/ci.txt
            python -m pip list --format=json
          } > "build/reports/architecture-release-identities-${{ runner.os }}-py${{ matrix.python-version }}.txt"
      - name: Run complete architecture release source and runtime gate
        shell: bash
        run: |
          set -euo pipefail
          make architecture-release-source-check 2>&1 | tee "build/reports/architecture-release-source-${{ runner.os }}-py${{ matrix.python-version }}.log"
      - name: Record L6 prediction numerical portability evidence
        shell: bash
        env:
          PHOSPY_L6_PREDICTION_LANE: architecture-release-source-${{ runner.os }}-py${{ matrix.python-version }}
          PHOSPY_L6_PREDICTION_EVIDENCE_PATH: build/reports/l6-prediction-portability-${{ runner.os }}-py${{ matrix.python-version }}.json
        run: |
          set -euo pipefail
          python -m pytest -o addopts= \
            tests/parity/test_l6_prediction_parity.py::test_l6_prediction_matrix_numeric_parity_matches_promoted_reference_surfaces \
            --junitxml "build/reports/l6-prediction-portability-${{ runner.os }}-py${{ matrix.python-version }}.xml"
      - name: Retain architecture release source lane
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: architecture-release-source-${{ runner.os }}-py${{ matrix.python-version }}
          path: build/reports/

  build-distributions:
    needs: repo-hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Build distributions and validate metadata
        run: |
          python -m pip install --upgrade pip
          python -m pip install -c constraints/ci.txt build twine setuptools wheel
          make build
          python scripts/verify_distribution_git_blobs.py --repo-root . --revision HEAD dist/*
          git rev-parse HEAD
          git rev-parse HEAD^{tree}
          sha256sum dist/*
      - name: Store distribution artifacts
        uses: actions/upload-artifact@v5
        with:
          name: python-package-distributions
          path: dist/

  installed-distribution-verification:
    needs: build-distributions
    runs-on: ${{ matrix.os }}
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.11', '3.12']
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: |
            pyproject.toml
            constraints/ci.txt
      - name: Download distribution artifacts
        uses: actions/download-artifact@v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Verify installed wheel and sdist outside checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build/reports
          {
            git rev-parse HEAD
            git rev-parse HEAD^{tree}
            python -c "import json, platform, sys; print(json.dumps({'os': platform.system(), 'release': platform.release(), 'architecture': platform.machine(), 'platform': platform.platform(), 'python': sys.version, 'executable': sys.executable}, sort_keys=True))"
            git hash-object constraints/ci.txt
            python -m pip list --format=json
            python -c "import hashlib, json, pathlib; print(json.dumps({p.name: hashlib.sha256(p.read_bytes()).hexdigest() for p in sorted(pathlib.Path('dist').iterdir())}, sort_keys=True))"
          } > "build/reports/consumer-identities-${{ runner.os }}-py${{ matrix.python-version }}.txt"
          python scripts/verify_installed_distributions.py --dist-dir dist --repo-root "$GITHUB_WORKSPACE" --constraint constraints/ci.txt 2>&1 | tee "build/reports/installed-consumers-${{ runner.os }}-py${{ matrix.python-version }}.json"
      - name: Retain wheel and sdist consumer results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: installed-consumers-${{ runner.os }}-py${{ matrix.python-version }}
          path: build/reports/
