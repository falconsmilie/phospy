site_name: PhosPy Documentation
site_description: PhosPy docs for scientists, Python users, and contributors
repo_url: https://github.com/falconsmilie/phospy
docs_dir: docs

theme:
  name: mkdocs

markdown_extensions:
  - toc:
      permalink: true
  - tables

nav:
  - Home: index.md
  - Quickstart: getting-started/quickstart-first-workflow.md
  - Troubleshooting: getting-started/troubleshooting-first-run.md
  - CLI Guide: cli.md
  - API Guide: api.md
  - Validation Guide: validation.md
  - Output Bundles: output_bundles.md
  - Release Notes 1.5.0: release_notes/1.5.0.md
  - Maintainer Docs:
      - Overview: contributor/index.md
      - Architecture: architecture/index.md
      - ADR Index: adr/index.md
      - Parity to PhosR: parity.md
      - Fixtures: fixtures.md
