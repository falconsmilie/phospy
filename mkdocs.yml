site_name: PhosPy Documentation
site_description: Python native implementation of selected PhosR style workflows for phosphoproteomics.
site_url: https://phospy.com/docs/
repo_url: https://github.com/falconsmilie/phospy
docs_dir: docs
strict: true

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.code.annotate
  palette:
    # Dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search
  - meta

extra_css:
  - phospy.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting started:
      - Installation: installation.md
      - Preparing a dataset: api/dataset-build-workflow.md
      - Running your first analysis: quickstart.md
  - Workflows:
      - Differential analysis: api/differential-analysis.md
      - Enrichment: api/enrichment.md
      - Kinase analysis: api/kinase.md
      - Signalome analysis: api/signalome.md
  - Core concepts:
      - Reference data: reference_bundles.md
      - Scientific interpretation and limitations: scientific-interpretation.md
      - Validation guide: validation.md
      - Output bundles: output_bundles.md
      - Phosphosite importers: importers.md
      - Performance contracts: performance.md
      - Scientific coverage: scientific-coverage.md
      - Parity to PhosR: parity.md
  - API reference:
      - API guide: api/guide.md
      - Supplementary workflow contract map: workflow_contracts.md
      - CLI status: cli.md
  - Contributing and maintenance:
      - Contributing: contributing.md
      - Maintenance: maintenance.md
      - Release notes: release-notes.md
      - Validation ownership map: validation-ownership.md
      - Testing audit docs: testing/README.md
      - ADR index: adr/index.md
