site_name: PhosPy Documentation
site_description: Python native implementation of selected PhosR style workflows for phosphoproteomics.
site_url: https://phospy.com/docs/
repo_url: https://github.com/falconsmilie/phospy
docs_dir: docs

theme:
  name: material
  font: false
  features:
#    - navigation.sections
    - navigation.top
    - navigation.footer
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.code.annotate
  palette:
    # Dark mode
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    # Light mode
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search
  - meta

extra_css:
  - phospy.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Quickstart: quickstart.md
  - API:
      - API Guide: api/guide.md
      - Dataset Build Workflow: api/dataset-build-workflow.md
      - Differential Workflow: api/differential-workflow.md
      - Kinase Workflow: api/kinase-workflow.md
      - Signalome Workflow: api/signalome-workflow.md
  - CLI Guide: cli.md
  - User Guides:
      - Workflow Contracts: workflow_contracts.md
      - Validation Guide: validation.md
      - Output Bundles: output_bundles.md
      - Performance Contracts: performance.md
      - Scientific Coverage: scientific-coverage.md
      - Parity to PhosR: parity.md
      - Contributing: contributing.md
  - Project:
      - Maintenance: maintenance.md
      - Release Notes: release-notes.md
      - ADR Index: adr/index.md
