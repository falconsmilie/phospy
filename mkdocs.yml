site_name: PhosPy Documentation
site_description: Friendly, practical documentation for PhosPy phosphoproteomics workflows.
site_url: https://phospy.com/docs/
repo_url: https://github.com/falconsmilie/phospy
docs_dir: docs
strict: true

theme:
  name: material
  font: false
  features:
    - navigation.sections
    - navigation.tracking
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.highlight
    - search.suggest
    - content.code.copy
    - content.code.select
    - content.code.annotate
  palette:
    - scheme: slate
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: blue grey
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode

plugins:
  - search
  - meta

extra_css:
  - phospy.css

markdown_extensions:
  - toc:
      permalink: true
  - tables
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.highlight:
      use_pygments: true
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences

nav:
  - Home: index.md
  - Getting Started:
      - Install PhosPy: installation.md
      - Prepare a Dataset: api/dataset-build-workflow.md
      - Run Your First Analysis: quickstart.md
  - Workflows:
      - Differential Analysis: api/differential-analysis.md
      - Enrichment: api/enrichment.md
      - Kinase Analysis: api/kinase.md
      - Signalome Analysis: api/signalome.md
  - Using PhosPy:
      - Public Python API: api/guide.md
      - Reference Data: reference_bundles.md
      - Scientific Interpretation: scientific-interpretation.md
      - Output Bundles: output_bundles.md
      - Import Phosphosite Data: importers.md
  - Advanced Reference:
      - Validation: validation.md
      - Scientific Coverage: scientific-coverage.md
      - Comparison With PhosR: parity.md
      - Performance Contracts: performance.md
      - CLI Status: cli.md
  - Contributing and Maintenance:
      - Contributing: contributing.md
      - Maintenance: maintenance.md
      - Release Notes: release-notes.md
      - Validation Ownership: validation-ownership.md
      - Testing Audit: testing/README.md
      - Architecture Decisions: adr/index.md
