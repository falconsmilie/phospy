repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.7
    hooks:
      - id: ruff-check
        args: [--fix]

      - id: ruff-format

  - repo: local
    hooks:
      - id: pyright
        name: pyright
        entry: .venv/Scripts/pyright.exe --warnings
        language: system
        types: [python]
        pass_filenames: false
