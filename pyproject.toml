exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  ".venv",
  "build",
  "dist",
  "legacy_archive",
  "src/phospy.egg-info",
]
reportMissingTypeStubs = "none"

[tool.setuptools.package-data]
phospy = [
  "data/reference_bundles/*/*/*.csv",
  "data/reference_bundles/*/*/*.json",
  "data/reference_bundles/*/*/*.md",
]

