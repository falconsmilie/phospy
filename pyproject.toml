[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phospy"
version = "1.5.0"
description = "Python native implementation of selected PhosR style workflows for phosphoproteomics."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "PhosPy Contributors" },
]
maintainers = [
  { name = "falconsmilie" },
]

keywords = [
  "phosphoproteomics",
  "proteomics",
  "bioinformatics",
  "phosphorylation",
  "phosphosite",
  "kinase",
  "ksea",
  "mass-spectrometry",
  "phosr",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://phospy.com"
Repository = "https://github.com/falconsmilie/phospy"
Documentation = "https://phospy.com/docs/"
Issues = "https://github.com/falconsmilie/phospy/issues"
Changelog = "https://github.com/falconsmilie/phospy/blob/main/CHANGELOG.md"
Citation = "https://github.com/falconsmilie/phospy/blob/main/CITATION.cff"
"Release Notes" = "https://github.com/falconsmilie/phospy/blob/main/docs/release_notes/1.5.0.md"

[project.optional-dependencies]
parquet = [
  "pyarrow>=15.0",
]

test = [
  "pytest>=8.0",
]

dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.15.7",
]

[project.scripts]
phospy = "phospy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["phospy", "phospy.*"]
exclude = ["phospy_legacy", "phospy_legacy.*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/parity"]
addopts = "-m \"not parity\""
markers = [
  "integration: multi-component rewrite workflow tests",
  "parity: compare Python outputs against R/PhosR reference fixtures",
  "activity_parity: hard regression gate for activity-stage parity fixtures and kernels",
  "parity_diagnostic: informational parity reporting tests (not threshold-bearing release gates)",
]

[tool.ruff]
line-length = 88
target-version = "py310"
force-exclude = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # formatter handles line wrapping
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
[tool.setuptools.package-data]
phospy = ["data/reference_bundles/*/*/*.csv"]
