[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phospy"
version = "0.1.0"
description = "A Python-first phosphoproteomics toolkit shaped around core PhosR-style outputs."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scikit-learn>=1.4",
]

[project.optional-dependencies]
test = [
  "pytest>=8.0",
]

viz = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "networkx>=3.2",
  "matplotlib-venn>=1.1",
]

enrich = [
  "gseapy>=1.1",
]

dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.15.7",
]

full = [
  "gseapy>=1.1",
  "matplotlib>=3.8",
  "matplotlib-venn>=1.1",
  "networkx>=3.2",
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.15.7",
  "seaborn>=0.13",
]

[project.scripts]
phospy = "phospy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "parity: compare Python outputs against R/PhosR reference fixtures",
]

[tool.ruff]
line-length = 88
target-version = "py310"
force-exclude = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # formatter handles line wrapping
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"