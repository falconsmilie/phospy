[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phosrpy"
version = "0.1.0"
description = "A Python-first phosphoproteomics toolkit shaped around core PhosR-style outputs."
readme = "README.md"
requires-python = ">=3.10"
license = {file = "LICENSE"}
classifiers = [
  "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Operating System :: OS Independent",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
]
optional-dependencies.test = [
  "pytest>=8.0",
]
optional-dependencies.viz = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "networkx>=3.2",
  "scikit-learn>=1.4",
  "matplotlib-venn>=1.1",
]
optional-dependencies.enrich = [
  "gseapy>=1.1",
]

[project.scripts]
phosrpy = "phosrpy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "parity: compare Python outputs against R/PhosR reference fixtures",
]
