[build-system]
requires = ["setuptools>=77.0.3", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "phospy"
version = "1.7.6"
description = "Python package for selected PhosR-inspired phosphoproteomics workflows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "PhosPy Contributors" },
]
maintainers = [
  { name = "falconsmilie (Shane)" },
]

keywords = [
  "phosphoproteomics",
  "proteomics",
  "bioinformatics",
  "phosphorylation",
  "phosphosite",
  "kinase",
  "ksea",
  "mass-spectrometry",
  "phosr",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.6",
]

[project.urls]
Homepage = "https://phospy.com"
Repository = "https://github.com/falconsmilie/phospy"
Documentation = "https://phospy.com/docs/"
Issues = "https://github.com/falconsmilie/phospy/issues"
Changelog = "https://github.com/falconsmilie/phospy/blob/main/CHANGELOG.md"
Citation = "https://github.com/falconsmilie/phospy/blob/main/CITATION.cff"
"Release Notes" = "https://phospy.com/docs/release-notes/"

[project.optional-dependencies]
parquet = [
  "pyarrow>=15.0",
]

test = [
  "hypothesis>=6",
  "pytest>=8.0",
  "setuptools>=77.0.3",
  "wheel>=0.45.1",
]

docs = [
  "mkdocs>=1.6",
  "mkdocs-material>=9.5",
  "pymdown-extensions>=10.0",
]

dev = [
  "hypothesis>=6",
  "pandas-stubs>=3.0.0.260204",
  "scipy-stubs>=1.17.1.0",
  "pre-commit>=4.0",
  "pyright>=1.1.410",
  "pytest>=8.0",
  "ruff>=0.15.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["phospy", "phospy.*"]
exclude = ["phospy_legacy", "phospy_legacy.*"]

[tool.pytest.ini_options]
testpaths = [
  "tests/unit",
  "tests/integration",
  "tests/parity",
  "tests/architecture",
]
addopts = "-m \"not parity\""
markers = [
  "unit: focused tests for a single module/function contract with isolated collaborators",
  "integration: multi-component rewrite workflow tests",
  "performance: lightweight performance contract tests for key scientific hot paths",
  "wall_clock_performance: absolute wall-clock performance contracts isolated from broad source/runtime processes",
  "contract: external-consumer public API contract tests that are release-blocking",
  "parity: compare Python outputs against R/PhosR reference fixtures",
  "slow: long-running tests that are useful for local confidence but not required in default fast loops",
  "release_gate: extended release-confidence tests (parity/performance/reproducibility and golden contracts)",
  "reproducibility: deterministic provenance or replay-critical behavior checks required for release confidence",
  "golden: golden fixture contract checks for stable scientific/provenance outputs",
  "activity_parity: hard regression gate for activity-stage parity fixtures and kernels",
  "parity_diagnostic: informational parity reporting tests (not threshold-bearing release gates)",
]

[tool.ruff]
line-length = 88
target-version = "py311"
force-exclude = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # formatter handles line wrapping
  "UP042", # keep str+Enum public contracts until StrEnum migration is reviewed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = [
  "src/phospy/activities",
  "src/phospy/api",
  "src/phospy/datasets",
  "src/phospy/differential",
  "src/phospy/enrichment",
  "src/phospy/evidence",
  "src/phospy/errors",
  "src/phospy/frames",
  "src/phospy/io",
  "src/phospy/kinase",
  "src/phospy/phosphosites",
  "src/phospy/preparation_records",
  "src/phospy/preprocessing",
  "src/phospy/policies",
