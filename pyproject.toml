[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phospy"
version = "1.5.1"
description = "Python native implementation of selected PhosR style workflows for phosphoproteomics."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "PhosPy Contributors" },
]
maintainers = [
  { name = "falconsmilie (Shane)" },
]

keywords = [
  "phosphoproteomics",
  "proteomics",
  "bioinformatics",
  "phosphorylation",
  "phosphosite",
  "kinase",
  "ksea",
  "mass-spectrometry",
  "phosr",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.6",
  "tomli>=2.0; python_version < '3.11'",
]

[project.urls]
Homepage = "https://phospy.com"
Repository = "https://github.com/falconsmilie/phospy"
Documentation = "https://phospy.com/docs/"
Issues = "https://github.com/falconsmilie/phospy/issues"
Changelog = "https://github.com/falconsmilie/phospy/blob/main/CHANGELOG.md"
Citation = "https://github.com/falconsmilie/phospy/blob/main/CITATION.cff"
"Release Notes" = "https://phospy.com/docs/release-notes-1.5.0/"

[project.optional-dependencies]
parquet = [
  "pyarrow>=15.0",
]

test = [
  "hypothesis>=6",
  "pytest>=8.0",
]

dev = [
  "hypothesis>=6",
  "pre-commit>=4.0",
  "pyright>=1.1.409",
  "pytest>=8.0",
  "ruff>=0.15.7",
]

[project.scripts]
phospy = "phospy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["phospy", "phospy.*"]
exclude = ["phospy_legacy", "phospy_legacy.*"]

[tool.pytest.ini_options]
testpaths = ["tests/unit", "tests/integration", "tests/parity"]
addopts = "-m \"not parity\""
markers = [
  "integration: multi-component rewrite workflow tests",
  "performance: lightweight performance contract tests for key scientific hot paths",
  "parity: compare Python outputs against R/PhosR reference fixtures",
  "activity_parity: hard regression gate for activity-stage parity fixtures and kernels",
  "parity_diagnostic: informational parity reporting tests (not threshold-bearing release gates)",
]

[tool.ruff]
line-length = 88
target-version = "py310"
force-exclude = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # formatter handles line wrapping
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.10"
typeCheckingMode = "standard"
include = [
  "src/phospy/api",
  "src/phospy/datasets",
  "src/phospy/io",
  "src/phospy/prediction",
  "src/phospy/provenance",
  "src/phospy/references",
  "src/phospy/signalomes/clustering",
  "src/phospy/tables",
  "src/phospy/validation",
  "src/phospy/workflows",
]
strict = [
  "src/phospy/tables/__init__.py",
  "src/phospy/validation/common/__init__.py",
  "src/phospy/validation/common/numbers.py",
  "src/phospy/references/__init__.py",
  "src/phospy/provenance/__init__.py",
  "src/phospy/io/publishers/__init__.py",
  "src/phospy/prediction/__init__.py",
  "src/phospy/prediction/sampling_core.py",
  "src/phospy/prediction/sampling_runtime.py",
  "src/phospy/signalomes/constants.py",
  "src/phospy/signalomes/science.py",
  "src/phospy/workflows/__init__.py",
  "src/phospy/workflows/kinase/executor.py",
  "src/phospy/workflows/kinase/validator.py",
  "src/phospy/workflows/signalome/executor.py",
  "src/phospy/api/results.py",
  "src/phospy/api/requests.py",
  "src/phospy/api/configs/common.py",
  "src/phospy/api/configs/dataset.py",
  "src/phospy/api/configs/kinase.py",
  "src/phospy/api/configs/prediction.py",
  "src/phospy/api/configs/references.py",
  "src/phospy/api/configs/signalome.py",
  "src/phospy/validation/ownership.py",
  "src/phospy/validation/workflows/configs.py",
  "src/phospy/provenance/environment.py",
  "src/phospy/io/bundles/_kinase/manifest.py",
  "src/phospy/io/bundles/_signalome/manifest.py",
  "src/phospy/io/publishers/workflows.py",
  "src/phospy/scientific_policies.py",
  "src/phospy/references/resolution.py",
  "src/phospy/prediction/policies.py",
  "src/phospy/provenance/serialization.py",
  "src/phospy/provenance/models.py",
  "src/phospy/io/bundles/_kinase/manifest.py",
  "src/phospy/io/bundles/_signalome/manifest.py",
  "src/phospy/io/publishers/workflows.py",
  "src/phospy/signalomes/clustering/backend_dispatch.py",
  "src/phospy/signalomes/clustering/diagnostic_schemas.py",
  "src/phospy/signalomes/clustering/diagnostics.py",
  "src/phospy/signalomes/clustering/protocol.py",
]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  ".venv",
  "build",
  "dist",
  "src/phospy.egg-info",
]
reportMissingTypeStubs = "none"
executionEnvironments = [
  { root = "src/phospy/tables", reportMissingTypeStubs = "none", reportUnnecessaryCast = "error", reportUnnecessaryTypeIgnoreComment = "error" },
  { root = "src/phospy/validation", reportMissingTypeStubs = "none", reportUnnecessaryCast = "error", reportUnnecessaryTypeIgnoreComment = "error" },
  { root = "src/phospy/references", reportMissingTypeStubs = "none", reportUnnecessaryCast = "error", reportUnnecessaryTypeIgnoreComment = "error" },
  { root = "src/phospy/workflows/kinase", reportMissingTypeStubs = "none", reportUnnecessaryCast = "error", reportUnnecessaryTypeIgnoreComment = "error" },
  { root = "src/phospy/workflows/signalome", reportMissingTypeStubs = "none", reportUnnecessaryCast = "error", reportUnnecessaryTypeIgnoreComment = "error" },
]

[tool.setuptools.package-data]
phospy = ["data/reference_bundles/*/*/*.csv"]
