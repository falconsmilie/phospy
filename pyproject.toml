[build-system]
requires = ["setuptools>=77.0.3", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "phospy"
version = "1.2.0"
description = "Python-native implementation of selected PhosR-style phosphoproteomics workflows."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-or-later"
license-files = ["LICENSE", "NOTICE.md"]
keywords = ["phosphoproteomics", "proteomics", "bioinformatics", "phosphorylation", "kinase"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]
dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "pydantic>=2.0",
  "scikit-learn>=1.4",
]

[project.urls]
Homepage = "https://github.com/falconsmilie/phospy"
Repository = "https://github.com/falconsmilie/phospy"
Documentation = "https://github.com/falconsmilie/phospy/tree/main/docs"
Issues = "https://github.com/falconsmilie/phospy/issues"
Changelog = "https://github.com/falconsmilie/phospy/blob/main/CHANGELOG.md"


[project.optional-dependencies]
parquet = [
  "pyarrow>=15.0",
]

test = [
  "pytest>=8.0",
]

dev = [
  "pre-commit>=4.0",
  "pytest>=8.0",
  "ruff>=0.15.7",
]

[project.scripts]
phospy = "phospy.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "parity: compare Python outputs against R/PhosR reference fixtures",
]

[tool.ruff]
line-length = 88
target-version = "py310"
force-exclude = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # formatter handles line wrapping
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
