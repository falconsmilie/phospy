[build-system]
requires = ["setuptools>=77.0.3", "wheel>=0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "phospy"
version = "1.6.0"
description = "Python package for selected PhosR-inspired phosphoproteomics workflows"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "GPL-3.0"
license-files = ["LICENSE", "NOTICE.md"]
authors = [
  { name = "PhosPy Contributors" },
]
maintainers = [
  { name = "falconsmilie (Shane)" },
]

keywords = [
  "phosphoproteomics",
  "proteomics",
  "bioinformatics",
  "phosphorylation",
  "phosphosite",
  "kinase",
  "ksea",
  "mass-spectrometry",
  "phosr",
]

classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
  "Topic :: Scientific/Engineering :: Bio-Informatics",
]

dependencies = [
  "numpy>=1.24",
  "pandas>=2.0",
  "scipy>=1.10",
  "scikit-learn>=1.6",
]

[project.urls]
Homepage = "https://phospy.com"
Repository = "https://github.com/falconsmilie/phospy"
Documentation = "https://phospy.com/docs/"
Issues = "https://github.com/falconsmilie/phospy/issues"
Changelog = "https://github.com/falconsmilie/phospy/blob/main/CHANGELOG.md"
Citation = "https://github.com/falconsmilie/phospy/blob/main/CITATION.cff"
"Release Notes" = "https://phospy.com/docs/release-notes/"

[project.optional-dependencies]
parquet = [
  "pyarrow>=15.0",
]

test = [
  "hypothesis>=6",
  "pytest>=8.0",
]

dev = [
  "hypothesis>=6",
  "pandas-stubs>=3.0.0.260204",
  "scipy-stubs>=1.17.1.0",
  "pre-commit>=4.0",
  "pyright>=1.1.410",
  "pytest>=8.0",
  "ruff>=0.15.7",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["phospy", "phospy.*"]
exclude = ["phospy_legacy", "phospy_legacy.*"]

[tool.pytest.ini_options]
testpaths = [
  "tests/unit",
  "tests/integration",
  "tests/parity",
  "tests/workflows",
  "tests/validation",
  "tests/science",
  "tests/architecture",
]
addopts = "-m \"not parity\""
markers = [
  "unit: focused tests for a single module/function contract with isolated collaborators",
  "integration: multi-component rewrite workflow tests",
  "performance: lightweight performance contract tests for key scientific hot paths",
  "parity: compare Python outputs against R/PhosR reference fixtures",
  "slow: long-running tests that are useful for local confidence but not required in default fast loops",
  "release_gate: extended release-confidence tests (parity/performance/reproducibility and golden contracts)",
  "reproducibility: deterministic provenance or replay-critical behavior checks required for release confidence",
  "golden: golden fixture contract checks for stable scientific/provenance outputs",
  "activity_parity: hard regression gate for activity-stage parity fixtures and kernels",
  "parity_diagnostic: informational parity reporting tests (not threshold-bearing release gates)",
]

[tool.ruff]
line-length = 88
target-version = "py311"
force-exclude = true

[tool.ruff.lint]
select = [
  "E",   # pycodestyle errors
  "F",   # pyflakes
  "I",   # import sorting
  "B",   # bugbear
  "UP",  # pyupgrade
]
ignore = [
  "E501",  # formatter handles line wrapping
  "UP042", # keep str+Enum public contracts until StrEnum migration is reviewed
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"

[tool.pyright]
pythonVersion = "3.11"
venvPath = "."
venv = ".venv"
typeCheckingMode = "standard"
include = [
  "src/phospy/api",
  "src/phospy/errors",
  "src/phospy/frames",
  "src/phospy/io",
  "src/phospy/policies",
  "src/phospy/provenance",
  "src/phospy/science",
  "src/phospy/tables",
  "src/phospy/validation",
  "src/phospy/workflows",
]
strict = [
  "src/phospy/science/datasets/models.py",
  "src/phospy/science/datasets/builders/normalizer.py",
  "src/phospy/validation/common/dataframes.py",
  "src/phospy/validation/datasets",
  "src/phospy/provenance/serialization",
  "src/phospy/science/transformations/models.py",
  "src/phospy/science/transformations/contracts.py",
  "src/phospy/science/transformations/transformers/identity.py",
  "src/phospy/science/sites",
  "src/phospy/science/differential/models",
  "src/phospy/science/differential/policy_models.py",
  "src/phospy/science/differential/empirical_bayes.py",
  "src/phospy/science/differential/multiple_testing.py",
  "src/phospy/science/differential/validator.py",
  "src/phospy/science/differential/aggregation/models.py",
  "src/phospy/science/differential/aggregation/scientific_policies.py",
  "src/phospy/science/references/models.py",
  "src/phospy/science/references/identifiers.py",
  "src/phospy/science/references/resolution.py",
  "src/phospy/validation/transformations/state.py",
  "src/phospy/validation/workflows/differential.py",
  "src/phospy/validation/references/bundle.py",
  "src/phospy/workflows/differential/models.py",
  "src/phospy/workflows/differential/validator.py",
  "src/phospy/workflows/differential/interpreter.py",
  "src/phospy/workflows/differential/executor.py",
  "src/phospy/workflows/enrichment/interpreter.py",
  "src/phospy/workflows/enrichment/executor.py",
  "src/phospy/workflows/kinase/interpreter.py",
  "src/phospy/workflows/kinase/executor.py",
  "src/phospy/workflows/kinase/component_models.py",
  "src/phospy/workflows/signalome/interpreter.py",
  "src/phospy/workflows/signalome/executor.py",
  "src/phospy/workflows/signalome/component_models.py",
  "src/phospy/science/signalomes/clustering/backend_dispatch.py",
  "src/phospy/science/signalomes/clustering/diagnostics.py",
  "src/phospy/science/signalomes/clustering/protocol.py",
  "src/phospy/science/prediction/policies.py",
]
exclude = [
  "**/__pycache__",
  "**/.pytest_cache",
  ".venv",
  "build",
  "dist",
  "legacy_archive",
  "src/phospy.egg-info",
]
reportMissingTypeStubs = "none"

[tool.setuptools.package-data]
phospy = [
  "data/reference_bundles/*/*/*.csv",
  "data/reference_bundles/*/*/*.json",
  "data/reference_bundles/*/*/*.md",
]

